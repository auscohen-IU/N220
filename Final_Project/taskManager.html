<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Task Manager</title>
</head>
<body>
    <h1>Personal Task Manager</h1>

    <!-- Username and Password Inputs -->
    <div>
        <h3>Username</h3>
        <input id="usernameInput" type="text" name="usernameInput">
        <h3>Password</h3>
        <input id="passwordInput" type="password" name="passwordInput">
    </div>

    <!-- Login/Logout Buttons -->
    <div>
        <button id="loginButton" onclick="loginAttempt()">Login</button>
        <button id="secondButton">Add User</button>
    </div>
    <br>

    <!-- Task List Section -->
    <div>
        <h2>Task List</h2>
        <input id="taskInput">
        <button type="button">Add Task</button>
        <section id="taskList"></section>
    </div>

    <script src="taskManager.js"></script>
</body>
</html>
